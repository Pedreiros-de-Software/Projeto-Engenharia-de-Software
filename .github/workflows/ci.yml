name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Build backend
        working-directory: backend
        run: |
          go mod download
          go mod verify
          go build ./...

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: go mod tidy (go.mod e go.sum em dia)
        working-directory: backend
        run: go mod tidy -diff
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  testes:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://consensu:consensu@localhost:5432/consensu?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: consensu
          POSTGRES_PASSWORD: consensu
          POSTGRES_DB: consensu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consensu -d consensu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Testes (backend, com Postgres)
        working-directory: backend
        run: go test -race -count=1 ./...

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Testes (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm test

  cobertura:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://consensu:consensu@localhost:5432/consensu?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: consensu
          POSTGRES_PASSWORD: consensu
          POSTGRES_DB: consensu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consensu -d consensu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Cobertura (backend)
        working-directory: backend
        run: |
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out > coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          { echo '### Cobertura backend'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cobertura backend
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: |
            backend/coverage.out
            backend/coverage.txt
            backend/coverage.html
          if-no-files-found: error

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cobertura (frontend, src/**)
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
      - name: Upload cobertura frontend
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: error

  mutacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          # Sem cache de build: o gremlins dá a cada mutante 3x o tempo da execução de referência, e com o cache
          # quente essa referência cai para ~50 ms e todos os mutantes estouram o tempo (eficácia 0%).
          cache: false
      - name: Teste de mutacao (backend/internal/voting, eficacia minima de 95%)
        working-directory: backend
        shell: bash
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          # O limiar vem de arquivo de configuração: na v0.6.0 a flag --threshold-efficacy é ignorada.
          printf 'unleash:\n  threshold:\n    efficacy: 95\n' > "$RUNNER_TEMP/gremlins.yaml"
          gremlins unleash --config "$RUNNER_TEMP/gremlins.yaml" ./internal/voting | tee mutacao.txt
      - name: Resumo do teste de mutacao
        if: always()
        working-directory: backend
        shell: bash
        run: |
          if [ -f mutacao.txt ]; then
            { echo '### Teste de mutacao (internal/voting)'; echo '```'; cat mutacao.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Credenciais locais do Postgres para o compose
        run: cp .env.example .env
      - name: Build das imagens
        run: docker compose build
      - name: Sobe o sistema e confere que responde pelo nginx
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/votacoes/1 | grep -q '<div id="root">'
          curl -fsS -X POST http://localhost:3000/api/login \
            -H 'Content-Type: application/json' \
            -d '{"login":"admin","senha":"admin123"}' | grep -q '"token"'
      - name: Teste de ponta a ponta da API pelo nginx (seed recém-criado)
        env:
          BASE_URL: http://localhost:3000
        run: bash scripts/e2e-api.sh
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derruba o sistema
        if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instala o Playwright e o Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Credenciais locais do Postgres para o compose
        run: cp .env.example .env
      - name: Sobe o sistema com o seed recém-criado
        run: docker compose up -d --build --wait
      - name: Testes de ponta a ponta da interface (Playwright)
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test
      - name: Upload do relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derruba o sistema
        if: always()
        run: docker compose down -v
